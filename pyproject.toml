[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-sdk"
version = "0.1.0"
description = "Python SDK for Software AI-agent reliability monitoring."
requires-python = ">=3.10"
readme = "SDK_INTEGRATION_GUIDE.md"
authors = [
  { name = "Software Reliability Engine" }
]

[tool.setuptools.packages.find]
include = ["software_sdk*"]
