[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixs"
version = "0.7.1"
description = "Matrixs zero-code integration and AI-agent reliability monitoring SDK."
requires-python = ">=3.10"
readme = "SDK_INTEGRATION_GUIDE.md"
authors = [
  { name = "Matrixs" }
]
dependencies = []

[project.scripts]
matrixs = "matrixs.cli:main"
software = "software_sdk.cli:main"

[project.urls]
Homepage = "https://software-reliability-engine.onrender.com"
Documentation = "https://software-reliability-engine.onrender.com/developer-docs"

[tool.setuptools.packages.find]
include = ["matrixs*", "software_sdk*"]
