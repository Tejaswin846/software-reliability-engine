<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Software</title>
    <link rel="stylesheet" href="/saas.css">
  </head>
  <body>
    <header class="topbar">
      <p class="brand"><span>Software</span><strong>Login</strong></p>
      <nav class="nav">
        <a href="/install">Install SDK</a>
        <a href="/register">Create account</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </header>
    <main class="shell">
      <section class="panel stack">
        <h1>Welcome back</h1>
        <p class="muted">Sign in with Clerk to manage projects, API keys, cloud workflows, and integrations.</p>
        <button type="button" data-clerk-sign-in>Sign in with Clerk</button>
        <button type="button" class="secondary" data-clerk-reset>Reset password</button>
        <a href="/install">Install the SDK without signing in</a>
        <div id="login-message" data-auth-message class="message"></div>
      </section>
    </main>
    <script src="/auth.js"></script>
    <script src="/saas.js"></script>
  </body>
</html>
