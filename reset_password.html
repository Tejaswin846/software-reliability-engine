<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose new password | Matrixs Reliability</title>
    <link rel="stylesheet" href="/saas.css?v=20260808c">
    <link rel="stylesheet" href="/ui.css?v=20260808c">
    <script src="/ui.js?v=20260808c" defer></script>
  </head>
  <body data-matrixs-page="reliability" class="auth-page">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">S</span><strong>Software+</strong></a>
      <nav class="nav">
        <button type="button" class="secondary" data-clerk-sign-in data-auth-redirect="/dashboard">Log in</button>
        <a href="/install">Install SDK</a>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-copy">
        <p class="eyebrow">Secure reset</p>
        <h1>Create a new password through <span class="accent-text">Clerk</span></h1>
        <p class="muted">Clerk verifies reset links and updates passwords. Matrixs receives only a valid session after recovery succeeds.</p>
      </section>
      <section class="auth-card stack">
        <h2>Continue password reset</h2>
        <p class="muted">Open the Clerk sign-in flow and continue the password recovery process.</p>
        <button type="button" data-clerk-reset data-auth-redirect="/dashboard" data-loading-text="Opening reset...">Continue in Clerk</button>
        <button type="button" class="secondary" data-clerk-sign-in data-auth-redirect="/dashboard">Back to login</button>
        <div id="reset-password-message" data-auth-message class="message"></div>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
