<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose New Password - Software</title>
    <link rel="stylesheet" href="/saas.css">
  </head>
  <body>
    <header class="topbar">
      <p class="brand"><span>Software</span><strong>Choose Password</strong></p>
      <nav class="nav">
        <a href="/login">Login</a>

    <script src="/auth.js"></script>
    <script src="/saas.js"></script>
