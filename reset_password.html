<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose New Password - Software</title>
    <link rel="stylesheet" href="/saas.css">
  </head>
  <body>
    <header class="topbar">
      <p class="brand"><span>Software</span><strong>Choose Password</strong></p>
      <nav class="nav">
        <a href="/login">Login</a>
        <a href="/">Home</a>
      </nav>
    </header>
    <main class="shell">
      <section class="panel stack">
        <h1>Create a new password</h1>
        <p class="muted">Use at least eight characters.</p>
        <form id="reset-password-form" class="stack">
          <label>New Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label>Confirm Password <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button type="submit">Update Password</button>
        </form>
        <div id="reset-password-message" class="message"></div>
      </section>
    </main>
    <script src="/auth.js"></script>
    <script src="/saas.js"></script>
  </body>
</html>
