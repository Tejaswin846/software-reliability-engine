services:
  - type: web
    name: software-reliability-engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Software.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: software-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SOFTWARE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: JWT_SECRET
        generateValue: true
      - key: SOFTWARE_API_DB_PATH
        value: /var/data/software_reliability.db
      - key: RELIABILITY_DB_PATH
        value: /var/data/reliability.db
      - key: PUBLIC_BASE_URL
        value: https://software-reliability-engine.onrender.com
      - key: SOFTWARE_ALLOWED_ORIGINS
        value: https://software-reliability-engine.onrender.com
      - key: SOFTWARE_SDK_API_KEYS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
