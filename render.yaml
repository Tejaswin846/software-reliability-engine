services:
  - type: web
    name: software-reliability-engine
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SOFTWARE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://software-reliability-engine.onrender.com
      - key: SOFTWARE_ALLOWED_ORIGINS
        value: https://software-reliability-engine.onrender.com
      - key: SOFTWARE_CLERK_AUTH_REQUIRED
        value: "true"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: SOFTWARE_SDK_API_KEYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOFTWARE_EXECUTION_CONTROL_BACKEND
        value: auto
      - key: SOFTWARE_EXECUTION_CONTROL_SUPABASE_READY
        value: "false"
      - key: CLARITY_PROJECT_ID
        value: xc0zbrjy3z
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      - key: SENTRY_ENABLE_LOGS
        value: "true"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: COMPOSIO_API_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: INTEGRATION_STATE_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SOFTWARE_REDIS_KEY_PREFIX
        value: software
      - key: SOFTWARE_AI_CACHE_TTL_SECONDS
        value: "3600"
      - key: SOFTWARE_CONVERSATION_STATE_TTL_SECONDS
        value: "21600"
      - key: SOFTWARE_SESSION_CACHE_TTL_SECONDS
        value: "3600"
      - key: SOFTWARE_AI_EXECUTION_STATE_TTL_SECONDS
        value: "1800"
      - key: SOFTWARE_REDIS_QUEUE_MAX_LENGTH
        value: "10000"
      - key: SOFTWARE_REDIS_RETRIES
        value: "2"
      - key: SOFTWARE_REDIS_RETRY_INTERVAL_SECONDS
        value: "0.25"
      - key: SOFTWARE_API_RATE_LIMIT_REQUESTS
        value: "300"
      - key: SOFTWARE_API_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
