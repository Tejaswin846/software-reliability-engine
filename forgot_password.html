<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Software</title>
    <link rel="stylesheet" href="/saas.css">
  </head>
  <body>
    <header class="topbar">
      <p class="brand"><span>Software</span><strong>Password Reset</strong></p>
      <nav class="nav">
        <a href="/login">Back to Login</a>
        <a href="/">Home</a>
      </nav>
    </header>
    <main class="shell">
      <section class="panel stack">
        <h1>Reset your password</h1>
        <p class="muted">Enter your account email and Supabase will send a secure reset link.</p>
        <form id="forgot-password-form" class="stack">
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <button type="submit">Send Reset Link</button>
        </form>
        <div id="forgot-password-message" class="message"></div>
      </section>
    </main>
    <script src="/auth.js"></script>
    <script src="/saas.js"></script>
  </body>
</html>
