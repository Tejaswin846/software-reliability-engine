<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Software</title>
    <link rel="stylesheet" href="/saas.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">S</span><strong>Software+</strong></a>
      <nav class="nav">
        <button type="button" class="secondary" data-clerk-sign-in data-auth-redirect="/dashboard">Log in</button>
        <a href="/install">Install SDK</a>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-copy">
        <p class="eyebrow">Account recovery</p>
        <h1>Reset your <span class="accent-text">Software password</span></h1>
        <p class="muted">Software does not send reset emails itself. Clerk owns password recovery, token validation, and password updates.</p>
      </section>
      <section class="auth-card stack">
        <h2>Open Clerk recovery</h2>
        <p class="muted">Choose forgot password in the Clerk sign-in flow and follow the email link from Clerk.</p>
        <button type="button" data-clerk-reset data-auth-redirect="/dashboard" data-loading-text="Opening reset...">Reset password with Clerk</button>
        <button type="button" class="secondary" data-clerk-sign-in data-auth-redirect="/dashboard">Back to login</button>
        <div id="forgot-password-message" data-auth-message class="message"></div>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
